name: Compilar APK do Orbion VPN

# A cada envio: monta o motor (Tor oficial + túnel compilado do código-fonte),
# confere o código Flutter, roda os testes e gera os APKs assinados.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'
  HEV_VERSION: '2.18.0'

jobs:
  apk:
    name: Motor, análise, testes e APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Ferramentas de conferência
        run: sudo apt-get update -qq && sudo apt-get install -y -qq file gnupg binutils >/dev/null

      - name: Motor — túnel (hev-socks5-tunnel) compilado do código-fonte
        run: scripts/compilar-hev.sh android/app/src/main/jniLibs

      - name: Motor — Tor, obfs4 e Snowflake do pacote oficial do Tor Project
        run: |
          if ! scripts/baixar-motor-tor.sh android/app/src/main/jniLibs android/app/src/main/assets; then
            echo "::warning::Download do pacote oficial falhou. Usando os binários de reserva (arm64, sem Snowflake)."
            mkdir -p android/app/src/main/jniLibs/arm64-v8a
            install -m 0755 nativo/reserva/arm64-v8a/libtor.so android/app/src/main/jniLibs/arm64-v8a/
            install -m 0755 nativo/reserva/arm64-v8a/libobfs4proxy.so android/app/src/main/jniLibs/arm64-v8a/
            # Sem Tor para as outras arquiteturas, não há como gerar APK delas.
            rm -rf android/app/src/main/jniLibs/armeabi-v7a android/app/src/main/jniLibs/x86_64
            echo "SO_ARM64=1" >> "$GITHUB_ENV"
          fi
          echo "Motor montado:"; find android/app/src/main/jniLibs -type f -exec ls -la {} \;
          [ -f android/app/src/main/assets/bridges_embutidas.json ] && \
            echo "::notice title=bridges::$(python3 -c "import json;d=json.load(open('android/app/src/main/assets/bridges_embutidas.json'));print(d['origem'],len(d['snowflake']),'snowflake',len(d['obfs4']),'obfs4')")" || true

      - name: Preparar Go (para o Snowflake)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Motor — Snowflake compilado do código-fonte
        continue-on-error: true
        run: |
          if ! scripts/compilar-snowflake.sh android/app/src/main/jniLibs; then
            echo "::warning::Snowflake não compilou; o app sai sem esse degrau do contorno."
            find android/app/src/main/jniLibs -name libsnowflake.so -delete
          fi

      - name: Resumo do motor
        run: |
          for d in android/app/src/main/jniLibs/*/; do
            abi="$(basename "$d")"
            itens="$(for f in "$d"*.so; do printf '%s(%s) ' "$(basename "$f" .so | sed 's/^lib//')" "$(file -b "$f" | grep -oE 'executable|shared object' | head -1)"; done)"
            echo "::notice title=motor $abi::$itens"
          done

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Baixar dependências
        run: flutter pub get

      - name: Análise estática (flutter analyze)
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analise.log; then
            grep -E "error -|error •" analise.log | head -40 | while IFS= read -r l; do echo "::error title=flutter analyze::$l"; done
            exit 1
          fi

      - name: Testes (flutter test)
        run: |
          set -o pipefail
          if ! flutter test 2>&1 | tee teste.log; then
            grep -E "FAILED|Expected:|Actual:|Error:|error:" teste.log | head -40 | while IFS= read -r l; do echo "::error title=flutter test::$l"; done
            exit 1
          fi

      - name: Chave de assinatura do Orbion
        env:
          CHAVE: ${{ secrets.ORBION_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.ORBION_KEYSTORE_SENHA }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$SENHA" ]; then
            # Sem os segredos, a esteira gera o APK com chave de depuração e
            # publica só para uso interno. A assinatura oficial do Orbion é
            # aplicada depois, fora da esteira, com a chave guardada pelo dono.
            echo "::notice::Sem chave de produção na esteira: APK sai para assinatura posterior."
            echo "ASSINATURA=interna" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/orbion.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/orbion.jks" "$SENHA" "orbion" "$SENHA" > android/key.properties
          echo "ASSINATURA=producao" >> "$GITHUB_ENV"

      - name: Compilar APKs (um por tipo de processador)
        run: |
          NUMERO=$((60 + ${{ github.run_number }}))
          ALVOS="android-arm,android-arm64,android-x64"
          [ "${SO_ARM64:-0}" = "1" ] && ALVOS="android-arm64"
          set -o pipefail
          if ! flutter build apk --release --split-per-abi --target-platform "$ALVOS" --build-number=$NUMERO 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong|FAILURE|Exception" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error title=flutter build::$l"; done
            exit 1
          fi
          VERSAO="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          mkdir -p saida
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$f" | sed -E 's/app-(.*)-release.apk/\1/')"
            cp "$f" "saida/Orbion-VPN-v${VERSAO}-${abi}.apk"
          done
          ls -la saida

      - name: Conferir o conteúdo e a assinatura dos APKs
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in saida/*.apk; do
            unzip -l "$apk" > lista.txt
            for obrigatorio in libtor.so libhev-socks5-tunnel.so libobfs4proxy.so libflutter.so libapp.so; do
              if ! grep -q "/$obrigatorio" lista.txt; then echo "::error::$apk sem $obrigatorio"; exit 1; fi
            done
            libs="$(grep -oE 'lib/[^/]+/[^ ]+\.so' lista.txt | sed 's#lib/[^/]*/##' | tr '\n' ' ')"
            echo "::notice title=$(basename "$apk")::$libs"
            "$APKSIGNER" verify "$apk"
          done
          sha256sum saida/*.apk > saida/SHA256SUMS.txt
          cat saida/SHA256SUMS.txt

      - name: Publicar os APKs (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: orbion-vpn-apk
          path: saida/

      - name: Publicar como Release (assinado oficialmente)
        if: env.ASSINATURA == 'producao'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: Orbion VPN — versão mais recente
          body: |
            Orbion VPN com interface em Flutter e motor nativo corrigido.
            Tor: pacote oficial do Tor Browser ${{ env.TOR_BROWSER_VERSION }} • túnel: hev-socks5-tunnel ${{ env.HEV_VERSION }}.
            Para a maioria dos celulares, use o arquivo **arm64-v8a**.
          files: |
            saida/*.apk
            saida/SHA256SUMS.txt
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar para assinatura (uso interno)
        if: env.ASSINATURA != 'producao'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compilacao-interna
          name: Compilação interna (NÃO instalar — falta a assinatura oficial)
          body: |
            Arquivos de trabalho da esteira, ainda com chave de depuração.
            A versão para instalar fica na release "apk-mais-recente".
            Tor Browser ${{ env.TOR_BROWSER_VERSION }} • hev-socks5-tunnel ${{ env.HEV_VERSION }} • execução ${{ github.run_number }}.
          files: |
            saida/*.apk
            saida/SHA256SUMS.txt
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
