name: orbion_vpn
description: "Orbion VPN — rede Tor com Kill Switch, interface em Flutter."
publish_to: 'none'
version: 6.3.0+75

environment:
  sdk: '>=3.5.0 <4.0.0'

# O motor nativo fala pelo canal "orbion/motor". O único pacote é a licença
# da Fortaleza Digital Security (Central de Licenças), usada só no APK de
# venda direta.
dependencies:
  flutter:
    sdk: flutter
  fortaleza_licenca:
    git:
      url: https://github.com/dasilvagonchoroskie-cpu/fortaleza-central-licencas.git
      path: pacote/fortaleza_licenca
      # licenca-v1 (commit fixo do pacote)
      ref: 8d208fbadafd65a681bd81473a4b49619b041b4c

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Política de Privacidade e Termos de Uso (lidos dentro do app, sem
  # internet) e as licenças dos componentes de código aberto do motor.
  assets:
    - assets/legal/
    - assets/licencas/
