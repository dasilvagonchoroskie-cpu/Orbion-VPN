name: orbion_vpn
description: "Orbion VPN — rede Tor com Kill Switch, interface em Flutter."
publish_to: 'none'
version: 6.2.0+74

environment:
  sdk: '>=3.5.0 <4.0.0'

# Sem pacotes de terceiros de propósito: a interface só conversa com o motor
# nativo pelo canal "orbion/motor". Menos dependência, menos coisa para
# quebrar numa atualização do Flutter.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Política de Privacidade e Termos de Uso (lidos dentro do app, sem
  # internet) e as licenças dos componentes de código aberto do motor.
  assets:
    - assets/legal/
    - assets/licencas/
